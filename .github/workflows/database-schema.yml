name: Database schema docs

# Keeps docs/database-schema.md in step with the migration sources.
#
# The generator needs *every* repo's migrations and this is the only repo that
# has them all, so the check lives here. It documents the schema at the
# submodule commits this repo **records**, not at the submodules' main branches:
# the recorded pointers are what this repo declares the services to be, and they
# are what a checkout gets. The document therefore changes when a pointer is
# bumped, which is exactly when this workflow runs.
#
# There is deliberately no scheduled run against submodule `main` tips. Pointers
# here lag their submodules by many releases in normal operation, so a nightly
# comparison against main would fail every night for a schema that is not yet
# pinned — noise, not signal. A migration merged upstream is caught when its
# pointer bump lands, which is the moment the documented schema actually changes.

on:
  pull_request:
    paths:
      - 'backend'
      - 'impact-assessor'
      - 'docs/db-schema/**'
      - 'docs/database-schema.md'
      - '.github/workflows/database-schema.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check the schema document is up to date
        id: check
        run: node docs/db-schema/generate.js --check

      # A failure means a submodule pointer moved and the document has not
      # caught up. Show the diff so the fix is a copy-paste.
      - name: Show what changed
        if: failure() && steps.check.outcome == 'failure'
        run: |
          node docs/db-schema/generate.js
          echo '::group::Diff'
          git --no-pager diff -- docs/database-schema.md || true
          echo '::endgroup::'
          echo 'Run `node docs/db-schema/generate.js` and commit the result.'
