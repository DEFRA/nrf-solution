services:
  backend:
    environment:
      NOTIFY_API_KEY: key
      # Host-mapped frontend port, so emailed quote links resolve from the host
      # (e.g. journey tests following the magic link).
      FRONTEND_BASE_URL: http://localhost:3010
  frontend:
    environment:
      GTM_ID: gtm_id
      # Ordnance Survey Vector Tile API key
      # Get a key from https://osdatahub.os.uk/
      # When set, the map page uses OS Vector Tile API base tiles instead of demo tiles
      OS_API_KEY: key

      # OAuth Client Credentials - use pre-prod env
      DEFRA_ID_CLIENT_ID:
      # Client secret
      DEFRA_ID_CLIENT_SECRET:
      # Service ID
      DEFRA_ID_SERVICE_ID:
      # Scope format must be openid,offline_access,<Defra ID clientId>
      # Adding the client ID at the end means an access token will be returned
      # Which can be used to authenticate with nrf-backend API
      DEFRA_ID_SCOPES: openid,offline_access,<paste defra ID client ID here>
  impact-assessor:
    environment:
      # Upstream WMTS GetTile URL for the aerial basemap, without the tile
      # coordinates — TILEMATRIX/TILEROW/TILECOL are appended per request.
      AERIAL_PROXY_BASE_URL:
